<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='330' viewBox='0 0 1000 330' font-family='Inter, Helvetica, Arial, sans-serif'><rect width='1000' height='330' rx='18' fill='#161616'/><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#F2C14E'/></marker><marker id='m' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#3ED598'/></marker></defs><text x='40' y='54' font-size='30' font-weight='800' fill='#F6EEDC' text-anchor='start'>Nothing goes out without you</text><text x='40' y='82' font-size='14' font-weight='400' fill='#F2C14E' text-anchor='start'>the sign-off flow for any email an intern drafts</text><rect x='46' y='116' width='160' height='100' rx='14' fill='#F2C14E'/><rect x='40' y='110' width='160' height='100' rx='14' fill='#F6EEDC'/><text x='54' y='146' font-size='16' font-weight='800' fill='#161616' text-anchor='start'>Intern drafts</text><text x='54' y='172' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>in your voice;</text><text x='54' y='190' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>voice.py checks it</text><line x1='208' y1='160' x2='224' y2='160' stroke='#F2C14E' stroke-width='2.5' marker-end='url(#a)'/><rect x='234' y='116' width='160' height='100' rx='14' fill='#F2C14E'/><rect x='228' y='110' width='160' height='100' rx='14' fill='#F6EEDC'/><text x='242' y='146' font-size='16' font-weight='800' fill='#161616' text-anchor='start'>Draft card</text><text x='242' y='172' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>the exact text, in your</text><text x='242' y='190' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>channel or a file</text><line x1='396' y1='160' x2='412' y2='160' stroke='#F2C14E' stroke-width='2.5' marker-end='url(#a)'/><rect x='422' y='116' width='160' height='100' rx='14' fill='#3ED598'/><rect x='416' y='110' width='160' height='100' rx='14' fill='#F6EEDC'/><text x='430' y='146' font-size='16' font-weight='800' fill='#161616' text-anchor='start'>You sign off</text><text x='430' y='172' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>a thumbs up or one</text><text x='430' y='190' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>command; 2 min to undo</text><line x1='584' y1='160' x2='600' y2='160' stroke='#F2C14E' stroke-width='2.5' marker-end='url(#a)'/><rect x='610' y='116' width='160' height='100' rx='14' fill='#F2C14E'/><rect x='604' y='110' width='160' height='100' rx='14' fill='#F6EEDC'/><text x='618' y='146' font-size='16' font-weight='800' fill='#161616' text-anchor='start'>Verify + lock</text><text x='618' y='172' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>the draft still</text><text x='618' y='190' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>matches the card</text><line x1='772' y1='160' x2='788' y2='160' stroke='#F2C14E' stroke-width='2.5' marker-end='url(#a)'/><rect x='798' y='116' width='160' height='100' rx='14' fill='#3ED598'/><rect x='792' y='110' width='160' height='100' rx='14' fill='#F6EEDC'/><text x='806' y='146' font-size='16' font-weight='800' fill='#161616' text-anchor='start'>Head intern</text><text x='806' y='172' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>sends that draft,</text><text x='806' y='190' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>once</text><text x='40' y='258' font-size='12' font-weight='400' fill='#F6EEDC' text-anchor='start'>The guard lets a scheduled run send only a signed-off card, past its two minutes, once. Live, only the head</text><text x='40' y='276' font-size='12' font-weight='400' fill='#F6EEDC' text-anchor='start'>intern can send, and only after your own message says send. A typed 'send' in the channel, or a sign-off on</text><text x='40' y='294' font-size='12' font-weight='400' fill='#F6EEDC' text-anchor='start'>an older version of the card, doesn't count. Undo inside the two minutes and nothing happens.</text></svg>
