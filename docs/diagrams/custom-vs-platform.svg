<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='730' viewBox='0 0 1000 730' font-family='Inter, Helvetica, Arial, sans-serif'><rect width='1000' height='730' rx='18' fill='#161616'/><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#F2C14E'/></marker><marker id='m' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#3ED598'/></marker></defs><text x='40' y='54' font-size='30' font-weight='800' fill='#F6EEDC' text-anchor='start'>Build your own, or use a ready-made bot?</text><text x='40' y='82' font-size='14' font-weight='400' fill='#F2C14E' text-anchor='start'>the trade, row by row</text><rect x='336' y='114' width='300' height='46' rx='10' fill='#3ED598'/><rect x='330' y='108' width='300' height='46' rx='10' fill='#F6EEDC'/><text x='480' y='138' font-size='16' font-weight='800' fill='#161616' text-anchor='middle'>your own interns</text><rect x='666' y='114' width='300' height='46' rx='10' fill='#5C5447'/><rect x='660' y='108' width='300' height='46' rx='10' fill='#F6EEDC'/><text x='810' y='138' font-size='16' font-weight='800' fill='#161616' text-anchor='middle'>a ready-made bot</text><text x='40' y='208' font-size='15' font-weight='700' fill='#F6EEDC' text-anchor='start'>Memory</text><rect x='330' y='180' width='300' height='44' rx='22' fill='#3ED598'/><text x='480' y='208' font-size='13' font-weight='700' fill='#161616' text-anchor='middle'>files you own</text><rect x='660' y='180' width='300' height='44' rx='22' fill='#5C5447'/><text x='810' y='208' font-size='13' font-weight='400' fill='#F6EEDC' text-anchor='middle'>the provider's systems</text><text x='40' y='270' font-size='15' font-weight='700' fill='#F6EEDC' text-anchor='start'>What they know</text><rect x='330' y='242' width='300' height='44' rx='22' fill='#3ED598'/><text x='480' y='270' font-size='13' font-weight='700' fill='#161616' text-anchor='middle'>your files, pipeline, prices</text><rect x='660' y='242' width='300' height='44' rx='22' fill='#5C5447'/><text x='810' y='270' font-size='13' font-weight='400' fill='#F6EEDC' text-anchor='middle'>what you tell it</text><text x='40' y='332' font-size='15' font-weight='700' fill='#F6EEDC' text-anchor='start'>The model</text><rect x='330' y='304' width='300' height='44' rx='22' fill='#3ED598'/><text x='480' y='332' font-size='13' font-weight='700' fill='#161616' text-anchor='middle'>any, chosen per job</text><rect x='660' y='304' width='300' height='44' rx='22' fill='#5C5447'/><text x='810' y='332' font-size='13' font-weight='400' fill='#F6EEDC' text-anchor='middle'>the provider's</text><text x='40' y='394' font-size='15' font-weight='700' fill='#F6EEDC' text-anchor='start'>What's shared</text><rect x='330' y='366' width='300' height='44' rx='22' fill='#3ED598'/><text x='480' y='394' font-size='13' font-weight='700' fill='#161616' text-anchor='middle'>you decide, per tool</text><rect x='660' y='366' width='300' height='44' rx='22' fill='#5C5447'/><text x='810' y='394' font-size='13' font-weight='400' fill='#F6EEDC' text-anchor='middle'>the platform's settings</text><text x='40' y='456' font-size='15' font-weight='700' fill='#F6EEDC' text-anchor='start'>Moving later</text><rect x='330' y='428' width='300' height='44' rx='22' fill='#3ED598'/><text x='480' y='456' font-size='13' font-weight='700' fill='#161616' text-anchor='middle'>copy a folder</text><rect x='660' y='428' width='300' height='44' rx='22' fill='#5C5447'/><text x='810' y='456' font-size='13' font-weight='400' fill='#F6EEDC' text-anchor='middle'>start again</text><text x='40' y='518' font-size='15' font-weight='700' fill='#F6EEDC' text-anchor='start'>Time to start</text><rect x='330' y='490' width='300' height='44' rx='22' fill='#3ED598'/><text x='480' y='518' font-size='13' font-weight='700' fill='#161616' text-anchor='middle'>a coffee break, then a weekend</text><rect x='660' y='490' width='300' height='44' rx='22' fill='#5C5447'/><text x='810' y='518' font-size='13' font-weight='400' fill='#F6EEDC' text-anchor='middle'>minutes</text><text x='40' y='580' font-size='15' font-weight='700' fill='#F6EEDC' text-anchor='start'>Cost</text><rect x='330' y='552' width='300' height='44' rx='22' fill='#3ED598'/><text x='480' y='580' font-size='13' font-weight='700' fill='#161616' text-anchor='middle'>your AI plan or API use</text><rect x='660' y='552' width='300' height='44' rx='22' fill='#5C5447'/><text x='810' y='580' font-size='13' font-weight='400' fill='#F6EEDC' text-anchor='middle'>a subscription</text><text x='40' y='642' font-size='15' font-weight='700' fill='#F6EEDC' text-anchor='start'>Upkeep</text><rect x='330' y='614' width='300' height='44' rx='22' fill='#3ED598'/><text x='480' y='642' font-size='13' font-weight='700' fill='#161616' text-anchor='middle'>a little, by you</text><rect x='660' y='614' width='300' height='44' rx='22' fill='#5C5447'/><text x='810' y='642' font-size='13' font-weight='400' fill='#F6EEDC' text-anchor='middle'>none, by them</text><text x='40' y='700' font-size='13' font-weight='400' fill='#F2C14E' text-anchor='start'>A ready-made bot is quicker to start and someone else runs it. Yours takes shaping and gets better the longer you keep it.</text></svg>
