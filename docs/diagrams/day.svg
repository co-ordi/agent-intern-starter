<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='330' viewBox='0 0 1000 330' font-family='Inter, Helvetica, Arial, sans-serif'><rect width='1000' height='330' rx='18' fill='#161616'/><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#F2C14E'/></marker><marker id='m' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#3ED598'/></marker></defs><text x='40' y='54' font-size='30' font-weight='800' fill='#F6EEDC' text-anchor='start'>A day in the team</text><text x='40' y='82' font-size='14' font-weight='400' fill='#F2C14E' text-anchor='start'>cron runs the schedule; you open an intern when you want one</text><circle cx='100' cy='150' r='10' fill='#F2C14E'/><line x1='114' y1='150' x2='246' y2='150' stroke='#5C5447' stroke-width='2' stroke-linecap='round'/><text x='100' y='126' font-size='15' font-weight='800' fill='#F6EEDC' text-anchor='middle'>19:00</text><text x='100' y='188' font-size='13' font-weight='700' fill='#F2C14E' text-anchor='middle'>sales</text><text x='100' y='210' font-size='12' font-weight='400' fill='#F6EEDC' text-anchor='middle'>lines up tomorrow</text><circle cx='260' cy='150' r='10' fill='#F2C14E'/><line x1='274' y1='150' x2='406' y2='150' stroke='#5C5447' stroke-width='2' stroke-linecap='round'/><text x='260' y='126' font-size='15' font-weight='800' fill='#F6EEDC' text-anchor='middle'>07:45</text><text x='260' y='188' font-size='13' font-weight='700' fill='#F2C14E' text-anchor='middle'>finance</text><text x='260' y='210' font-size='12' font-weight='400' fill='#F6EEDC' text-anchor='middle'>new statements</text><circle cx='420' cy='150' r='10' fill='#F2C14E'/><line x1='434' y1='150' x2='566' y2='150' stroke='#5C5447' stroke-width='2' stroke-linecap='round'/><text x='420' y='126' font-size='15' font-weight='800' fill='#F6EEDC' text-anchor='middle'>08:15</text><text x='420' y='188' font-size='13' font-weight='700' fill='#F2C14E' text-anchor='middle'>sales · marketing</text><text x='420' y='210' font-size='12' font-weight='400' fill='#F6EEDC' text-anchor='middle'>replies, post options</text><circle cx='580' cy='150' r='10' fill='#F2C14E'/><line x1='594' y1='150' x2='726' y2='150' stroke='#5C5447' stroke-width='2' stroke-linecap='round'/><text x='580' y='126' font-size='15' font-weight='800' fill='#F6EEDC' text-anchor='middle'>08:30</text><text x='580' y='188' font-size='13' font-weight='700' fill='#F2C14E' text-anchor='middle'>the head intern</text><text x='580' y='210' font-size='12' font-weight='400' fill='#F6EEDC' text-anchor='middle'>the morning report</text><circle cx='740' cy='150' r='10' fill='#3ED598'/><line x1='754' y1='150' x2='886' y2='150' stroke='#5C5447' stroke-width='2' stroke-linecap='round'/><text x='740' y='126' font-size='15' font-weight='800' fill='#F6EEDC' text-anchor='middle'>day</text><text x='740' y='188' font-size='13' font-weight='700' fill='#F2C14E' text-anchor='middle'>you</text><text x='740' y='210' font-size='12' font-weight='400' fill='#F6EEDC' text-anchor='middle'>work, sign off drafts</text><circle cx='900' cy='150' r='10' fill='#F2C14E'/><text x='900' y='126' font-size='15' font-weight='800' fill='#F6EEDC' text-anchor='middle'>Friday</text><text x='900' y='188' font-size='13' font-weight='700' fill='#F2C14E' text-anchor='middle'>everyone</text><text x='900' y='210' font-size='12' font-weight='400' fill='#F6EEDC' text-anchor='middle'>score the week</text><text x='40' y='272' font-size='12' font-weight='400' fill='#F6EEDC' text-anchor='start'>Scheduled runs are headless: they draft and suggest. The only send is a card you've signed off.</text><text x='40' y='296' font-size='12' font-weight='700' fill='#3ED598' text-anchor='start'>Everything the team knows is a file you can open.</text></svg>
