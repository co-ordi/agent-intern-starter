<svg xmlns='http://www.w3.org/2000/svg' width='760' height='520' viewBox='0 0 760 520' font-family='Inter, Helvetica, Arial, sans-serif'><rect width='760' height='520' rx='18' fill='#161616'/><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#F2C14E'/></marker><marker id='m' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#3ED598'/></marker></defs><rect x='36' y='36' width='690' height='450' rx='16' fill='#3ED598'/><rect x='30' y='30' width='690' height='450' rx='16' fill='#F6EEDC'/><circle cx='66' cy='70' r='16' fill='#F2C14E'/><text x='66' y='75' font-size='14' font-weight='800' fill='#161616' text-anchor='middle'>T</text><text x='92' y='66' font-size='15' font-weight='800' fill='#161616' text-anchor='start'>Head intern (Theo)</text><text x='92' y='84' font-size='11' font-weight='400' fill='#5C5447' text-anchor='start'>08:30 · the morning report (example)</text><text x='60' y='122' font-size='15' font-weight='800' fill='#161616' text-anchor='start'>Win the Harbour Studio call at 11: the ask is a start date.</text><text x='60' y='171' font-size='11' font-weight='800' fill='#5C5447' text-anchor='start'>START HERE</text><text x='60' y='195' font-size='13' font-weight='400' fill='#161616' text-anchor='start'>1. 09:00  Reply to Sam at Harbour Studio: draft ready to sign off</text><text x='60' y='221' font-size='13' font-weight='400' fill='#161616' text-anchor='start'>2. 09:15  Ten calls from today's sheet, best window 10-11</text><text x='60' y='247' font-size='13' font-weight='400' fill='#161616' text-anchor='start'>3. 11:00  Harbour Studio call: prep pack on the board</text><text x='60' y='294' font-size='13' font-weight='400' fill='#161616' text-anchor='start'>SALES · Two replies overnight; one wants a proposal by Friday</text><text x='60' y='320' font-size='13' font-weight='400' fill='#161616' text-anchor='start'>MARKETING · Post options ready; option B tests a question hook</text><text x='60' y='346' font-size='13' font-weight='400' fill='#161616' text-anchor='start'>FINANCE · Cash is fine; one invoice is 9 days overdue, chaser drafted</text><text x='60' y='393' font-size='13' font-weight='800' fill='#161616' text-anchor='start'>ONE DECISION: send the proposal at the standard price, or offer a pilot?</text><text x='60' y='440' font-size='12' font-weight='400' fill='#5C5447' text-anchor='start'>Orders · Sales: proposal draft by Thursday · Finance: chase invoice 0042</text><text x='30' y='508' font-size='11' font-weight='400' fill='#F6EEDC' text-anchor='start'>Example only: a made-up business. Yours is built from your interns' notes each morning.</text></svg>
